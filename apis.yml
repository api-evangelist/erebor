    Erebor's developer API for programmatic access to banking, money-movement, and
    stablecoin operations. The gateway at api.erebor.bank authenticates requests
    with an API key and returns a structured JSON error envelope
    ({docs_url, error, field, message}); API keys are minted in the Auth0-secured
    developer dashboard, which supports separate test and live modes. Full
    reference documentation is published on Fern at docs.erebor.bank but is gated
    behind login.
