aid: erebor
name: Erebor
description: >-
  Erebor is a digital-first, FDIC-insured national bank built for the innovation
  economy — technology startups, cryptocurrency and stablecoin businesses, and AI
  and defense companies that traditional banks have historically underserved.
  Co-founded by Palmer Luckey (Anduril) and Joe Lonsdale (8VC) and backed by
  Founders Fund, Lux Capital, Haun Ventures, and 8VC, Erebor received OCC
  preliminary conditional approval in October 2025, FDIC deposit-insurance
  approval in December 2025, and launched in February 2026. It offers deposit
  accounts, wires and money movement, and stablecoin operations. Erebor exposes a
  developer API at api.erebor.bank secured with API keys, an Auth0-authenticated
  developer dashboard at developer.erebor.bank, and Fern-based developer
  documentation at docs.erebor.bank. The public developer docs are login-gated, so
  the machine-readable surface captured here is limited to what is observable
  without credentials.
